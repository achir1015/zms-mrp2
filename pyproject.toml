[project]
name = "zms-mrp2"
version = "1.2.0"
description = "資料助秘之物料需求II生產製造系統"
authors = [{ name = "吳玉柱" }]
requires-python = ">=3.10"
dependencies = ["flet==1.1.2", "flet-audio==1.1.2", "pymysql>=1.1"]

[tool.flet]
org = "com.achir"
product = "資料助秘之物料需求II生產製造系統"
company = "吳玉柱"
copyright = "© 2026 吳玉柱"

[tool.flet.app]
path = "."
exclude = ["tests", "tools", "packaging", "data", "data_mobile", ".venv", "dist", "dist-installer", "dist-android",
           "dist-ios", "dist-mac", "build", "build-mac", "docs", "db", "android", "run_web.py", "run_web_mobile.py",
           "*.spec", "*.log", "*.pdf", "assets/icon.ico", "assets/icon-256.png"]

[tool.flet.deep_linking]
scheme = "zmsmrp2"
host = "connect"

[tool.flet.android]
permissions = { "android.permission.INTERNET" = true }

[tool.flet.ios]
bundle_id = "com.achir.zmsmrp2"
team_id = "7BN6XJ59KP"

[tool.flet.ios.info]
NSLocalNetworkUsageDescription = "連到公司電腦上的 MRP II 系統"
ITSAppUsesNonExemptEncryption = false
UIRequiresFullScreen = true
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
